name: finhub
description: "Mobile app for financial advisors — iOS and Android."
# Never published to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  # Avatar and client photo loading with a disk cache.
  cached_network_image: ^3.4.1
  # Document attachment on service-request forms.
  file_picker: ^9.0.0
  # Line and donut chart rendering for the AUM history and allocation views.
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Riverpod is the only state management in this app — no setState, no BLoC.
  flutter_riverpod: ^3.3.1
  # Tokens and other credentials go to the platform keystore, never to
  # SharedPreferences — see StorageService.
  flutter_secure_storage: ^10.2.0
  # Renders the bundled empty-state illustration.
  flutter_svg: ^2.0.10
  # Declarative routing and the redirect hook the route guard hangs off.
  go_router: ^17.2.3
  # The app's own mark is the `mdi:finance` glyph. Icons are always static
  # inline SVG strings — never a set that fetches at runtime.
  iconify_flutter: ^0.0.7
  # Date, number and currency formatting, and the plumbing behind l10n.
  intl: ^0.20.2
  # AppLogger's backend. Diagnostic output never goes through print/debugPrint.
  logger: ^2.7.0
  # Form state for every input in shared/widgets/inputs.
  reactive_forms: ^18.2.2
  # Non-sensitive preferences — locale, onboarding state.
  shared_preferences: ^2.5.5
  # Loading placeholders while data is in flight.
  shimmer: ^3.0.0
  # Opens the investor portal from the dashboard's quick actions.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

flutter:
  # Generates AppLocalizations from lib/l10n/*.arb — see l10n.yaml.
  generate: true

  uses-material-design: true

  assets:
    - assets/images/
    # Every read goes through MockDataSource. Each feature adds its own
    # fixture directory on the day that feature lands.
    - assets/mock-data/accounts/
    - assets/mock-data/auth/
    - assets/mock-data/commissions/
    - assets/mock-data/dashboard/
    - assets/mock-data/households/
    - assets/mock-data/profile/
    - assets/mock-data/transactions/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Regenerate with `dart run flutter_launcher_icons` after replacing the
# source images in assets/icons/. They are build-time inputs only and are
# deliberately not bundled into the app.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "assets/icons/app_icon_background.png"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true

# Regenerate with `dart run flutter_native_splash:create`.
#
# Solid colour only, on both platforms and both Android splash paths — the
# app's mark is the `mdi:finance` glyph drawn in Dart, so there is no splash
# artwork to keep in sync.
flutter_native_splash:
  color: "#081A30"
  android_12:
    color: "#081A30"
  android: true
  ios: true
